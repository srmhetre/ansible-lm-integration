name: Self-Contained Safe Playbook
description: A standalone read-only playbook with no external dependencies

trigger:
  type: manual

variables:
  sample_user: "demo_user"
  sample_ip: "192.0.2.10"

steps:
  - name: Set Status
    action: set_variable
    inputs:
      name: result
      value: "Playbook started successfully"

  - name: Prepare Summary
    action: set_variable
    inputs:
      name: summary
      value: |
        User: {{sample_user}}
        Source IP: {{sample_ip}}
        Result: {{result}}

  - name: Write Log
    action: write_log
    inputs:
      message: "{{summary}}"

outputs:
  status: completed
  message: "{{summary}}"
