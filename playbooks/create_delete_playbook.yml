---
- name: Create or Delete a File Based on User Input
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: operation
      prompt: "Enter operation (create/delete)"
      private: no

    - name: file_path
      prompt: "Enter the full file path"
      private: no

  tasks:
    - name: Validate operation
      assert:
        that:
          - operation in ['create', 'delete']
        fail_msg: "Invalid operation. Please choose 'create' or 'delete'."

    - name: Create the file
      ansible.builtin.file:
        path: "{{ file_path }}"
        state: touch
        mode: '0644'
      when: operation == "create"

    - name: Delete the file
      ansible.builtin.file:
        path: "{{ file_path }}"
        state: absent
      when: operation == "delete"

    - name: Display result
      debug:
        msg: >-
          File {{ file_path }}
          {{ 'created' if operation == 'create' else 'deleted' }} successfully.
