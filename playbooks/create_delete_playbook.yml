---
- name: File create or delete from survey input
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Ensure required inputs are provided
      ansible.builtin.assert:
        that:
          - operation is defined
          - file_path is defined
          - operation in ['create', 'delete']
        fail_msg: "Provide operation=create|delete and file_path."

    - name: Create file
      ansible.builtin.file:
        path: "{{ file_path }}"
        state: touch
        mode: "0644"
      when: operation == "create"

    - name: Delete file
      ansible.builtin.file:
        path: "{{ file_path }}"
        state: absent
      when: operation == "delete"
