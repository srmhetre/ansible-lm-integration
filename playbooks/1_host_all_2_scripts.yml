---
- name: Sample playbook for all hosts with 2 scripts
  hosts: all
  gather_facts: false
  tasks:
    - name: Debug separator - play start
      debug:
        msg: "===== SAMPLE 1 START: hosts=all, script 1/2 ====="

    - name: Script 1 - safe command
      ansible.builtin.command: /bin/echo "Hello from script 1 on all hosts"

    - name: Debug separator - between scripts
      debug:
        msg: "----- SAMPLE 1 MIDPOINT: moving to script 2/2 -----"

    - name: Script 2 - safe command
      ansible.builtin.command: /bin/echo "Hello from script 2 on all hosts"

    - name: Debug separator - play end
      debug:
        msg: "===== SAMPLE 1 END ====="
